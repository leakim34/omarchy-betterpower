name: ci

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: lint
        run: scripts/lint.sh
      - name: test
        run: node --test 'tests/**/*.test.js'
